; PHP per-directory settings for the web root (read by lsphp/CGI; copy next to index.php).
; Manuscript PDFs are uploaded through the papers form; keep post_max_size above
; upload_max_filesize so the form fields still fit beside the file.
upload_max_filesize = 64M
post_max_size = 72M
max_input_time = 300
max_execution_time = 120
memory_limit = 256M
